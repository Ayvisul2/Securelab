
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Awareness - SecureLab</title>
</head>

<body style="
    margin: 0;
    padding: 40px 15px;
    font-family: Arial, sans-serif;
    background: #1b100e;
    color: white;
">

<div style="
    max-width: 450px;
    margin: auto;
    padding: 30px;
    background: #29201e;
    border-radius: 12px;
">

    <h2 style="color: #8ab4f8;">SecureLab</h2>

    <p style="color: #bbb;">Step 2 of 2</p>

    <h3>Security Awareness Demonstration</h3>

    <form id="passwordForm">

        <label for="password">
            Password field demonstration
        </label>

        <input
            type="password"
            id="password"
            placeholder="Password field example"
            autocomplete="off"
            style="
                width: 100%;
                box-sizing: border-box;
                padding: 14px;
                margin-top: 12px;
                border: 1px solid #777;
                border-radius: 5px;
                font-size: 16px;
                background: #1b100e;
                color: white;
            "
        >

        <p style="
            color: #fbbc04;
            font-size: 13px;
            line-height: 1.6;
        ">
            Never enter your real password through
            an unexpected email link.
        </p>

        <button
            type="submit"
            style="
                width: 100%;
                padding: 14px;
                margin-top: 20px;
                background: #8ab4f8;
                border: none;
                border-radius: 5px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
            "
        >
            CONTINUE
        </button>

    </form>

</div>

<script>
document.getElementById("passwordForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    // Do not read or transmit the password field.
    window.location.href = "complete.html";

});
</script>

</body>
</html>
